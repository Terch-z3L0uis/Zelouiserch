
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Vash & Wolfwood ♡</title>

  <style>
    body {
      background: #fff0f5;
      text-align: center;
      font-family: Arial, sans-serif;
      padding-top: 60px;
    }

    h1 {
      color: #c87891;
    }

    .chibis {
      width: 300px;
      max-width: 90%;
      animation: bounce 1.2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-35px);
      }
    }


/* LOVE & DONUTS ANIMATIONS ♡ */

body {
  overflow-x: hidden;
}

/* Floating hearts and donuts */
.floaty {
  position: fixed;
  bottom: -50px;
  font-size: 28px;
  pointer-events: none;
  z-index: 1;
  animation: floatUp 6s linear infinite;
}

/* Move upward gently */
@keyframes floatUp {
  0% {
    transform: translateY(0) rotate(-10deg);
    opacity: 0;
  }

  15% {
    opacity: 1;
  }

  85% {
    opacity: 1;
  }

  100% {
    transform: translateY(-110vh) rotate(20deg);
    opacity: 0;
  }
}

/* Sparkling stars */
.sparkle {
  position: fixed;
  font-size: 25px;
  pointer-events: none;
  z-index: 1;
  animation: twinkle 2s ease-in-out infinite alternate;
}

@keyframes twinkle {
  from {
    opacity: 0.2;
    transform: scale(0.6);
  }

  to {
    opacity: 1;
    transform: scale(1.2);
  }
}

/* Extra happy jump when clicked! */
.chibis.happy {
  animation: happyBounce 0.5s ease-in-out;
}

@keyframes happyBounce {
  0%, 100% {
    transform: translateY(0) scale(1);
  }
  50% {
    transform: translateY(-85px) scale(1.1);
  }
}

/* Little surprise message */
.love-message {
  position: fixed;
  left: 50%;
  top: 18%;
  transform: translateX(-50%);
  color: #d36b93;
  font-size: 24px;
  font-weight: bold;
  pointer-events: none;
  z-index: 10;
  animation: messagePop 1.3s ease-out forwards;
}

@keyframes messagePop {
  0% { opacity: 0; }
  25% { opacity: 1; }
  75% { opacity: 1; }
  100% { opacity: 0; }
}

/* Hearts and donuts that pop out */
.pop-treat {
  position: fixed;
  font-size: 28px;
  pointer-events: none;
  z-index: 10;
  animation: treatPop 1s ease-out forwards;
}

@keyframes treatPop {
  0% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(0.5);
  }
  100% {
    opacity: 0;
    transform:
      translate(calc(-50% + var(--x)),
                calc(-50% + var(--y)))
      scale(1.3);
  }
}
    
  </style>
</head>
  
<body>
  <h1>Love & Peace! ♡</h1>

  <img src="Vash-Wolfwood-transparent.png"
     class="chibis"
     id="myChibis"
     alt="Vash and Wolfwood"
     onclick="happyJump()">


  <p>Two silly little guys! 🍩</p>
  
<!-- Floating hearts ♡ -->
<div class="floaty"
     style="left:10%; animation-delay:-1s;">
  💗
</div>

<div class="floaty"
     style="left:40%; animation-delay:-3s;">
  💕
</div>

<div class="floaty"
     style="left:85%; animation-delay:-5s;">
  💖
</div>

<!-- Floating donuts 🍩 -->
<div class="floaty"
     style="left:25%; animation-delay:-2s;">
  🍩
</div>

<div class="floaty"
     style="left:70%; animation-delay:-4s;">
  🍩
</div>

<!-- Twinkling sparkles ✨ -->
<div class="sparkle"
     style="top:25%; left:12%;">
  ✨
</div>

<div class="sparkle"
     style="top:40%; right:12%;
            animation-delay:1s;">
  ✦
</div>

<div class="sparkle"
     style="bottom:20%; left:18%;
            animation-delay:0.5s;">
  ✧
</div>


<script>
  function happyJump() {
    const chibis = document.getElementById("myChibis");

    // Restart the happy jump
    chibis.classList.remove("happy");
    void chibis.offsetWidth;
    chibis.classList.add("happy");

    // Show a cute message
    const message = document.createElement("div");
    message.className = "love-message";
    message.textContent = "LOVE & PEACE!! ♡";
    document.body.appendChild(message);

    setTimeout(() => message.remove(), 1300);

    // Find the center of the chibis
    const rect = chibis.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    // Pop out hearts and donuts!
    const treats = ["🍩", "💕", "💗", "✨", "🍩"];

    treats.forEach((treat, i) => {
      const pop = document.createElement("span");

      pop.className = "pop-treat";
      pop.textContent = treat;
      pop.style.left = centerX + "px";
      pop.style.top = centerY + "px";

      const angle = (i / treats.length) * Math.PI * 2;
      pop.style.setProperty(
        "--x", Math.cos(angle) * 110 + "px"
      );
      pop.style.setProperty(
        "--y", Math.sin(angle) * 110 + "px"
      );

      document.body.appendChild(pop);
      setTimeout(() => pop.remove(), 1000);
    });
  }
</script>

  
</body>
</html>
