
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Vash & Wolfwood ♡</title>

  <style>
    body {
      background: #fff0f5;
      text-align: center;
      font-family: Arial, sans-serif;
      padding-top: 60px;
    }

    h1 {
      color: #c87891;
    }

    .chibis {
      width: 300px;
      max-width: 90%;
      animation: bounce 1.2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-35px);
      }
    }


/* LOVE & DONUTS ANIMATIONS ♡ */

body {
  overflow-x: hidden;
}

/* Floating hearts and donuts */
.floaty {
  position: fixed;
  bottom: -50px;
  font-size: 28px;
  pointer-events: none;
  z-index: 1;
  animation: floatUp 6s linear infinite;
}

/* Move upward gently */
@keyframes floatUp {
  0% {
    transform: translateY(0) rotate(-10deg);
    opacity: 0;
  }

  15% {
    opacity: 1;
  }

  85% {
    opacity: 1;
  }

  100% {
    transform: translateY(-110vh) rotate(20deg);
    opacity: 0;
  }
}

/* Sparkling stars */
.sparkle {
  position: fixed;
  font-size: 25px;
  pointer-events: none;
  z-index: 1;
  animation: twinkle 2s ease-in-out infinite alternate;
}

@keyframes twinkle {
  from {
    opacity: 0.2;
    transform: scale(0.6);
  }

  to {
    opacity: 1;
    transform: scale(1.2);
  }
}

/* Extra happy jump when clicked! */
.chibis.happy {
  animation: happyBounce 0.5s ease-in-out;
}

@keyframes happyBounce {
  0%, 100% {
    transform: translateY(0) scale(1);
  }
  50% {
    transform: translateY(-85px) scale(1.1);
  }
}

/* Little surprise message */
.love-message {
  position: fixed;
  left: 50%;
  top: 18%;
  transform: translateX(-50%);
  color: #d36b93;
  font-size: 24px;
  font-weight: bold;
  pointer-events: none;
  z-index: 10;
  animation: messagePop 1.3s ease-out forwards;
}

@keyframes messagePop {
  0% { opacity: 0; }
  25% { opacity: 1; }
  75% { opacity: 1; }
  100% { opacity: 0; }
}

/* Hearts and donuts that pop out */
.pop-treat {
  position: fixed;
  font-size: 28px;
  pointer-events: none;
  z-index: 10;
  animation: treatPop 1s ease-out forwards;
}

@keyframes treatPop {
  0% {
    opacity: 1;
    transform: translate(-50%, -50%) scale(0.5);
  }
  100% {
    opacity: 0;
    transform:
      translate(calc(-50% + var(--x)),
                calc(-50% + var(--y)))
      scale(1.3);
  }
}

    
/* Tiny donut that follows the mouse! */
.donut-cursor {
  position: fixed;
  left: 0;
  top: 0;
  font-size: 28px;
  pointer-events: none;
  z-index: 9999;
  transform: translate(-50%, -50%);
  transition: left 0.06s linear, top 0.06s linear;
  display: none;
}

    
/* LoveOS — Our tiny pastel computer! */
.loveos-window {
  position: relative;
  width: 320px;
  max-width: 90%;
  margin: 30px auto;
  background: #fffafc;
  border: 3px solid #e9a8c5;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 8px 20px #d98fb355;
  font-family: Arial, sans-serif;
}

/* Pink title bar */
.loveos-title {
  background: #f8c7dc;
  padding: 12px;
  color: #914b70;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
  align-items: center;
    cursor: grab;
  user-select: none;
}

/* Inside the window */
.loveos-content {
  padding: 25px 15px;
  text-align: center;
  color: #a85c80;
}

/* Our close button */
.loveos-close {
  background: #fff0f6;
  border: none;
  border-radius: 6px;
  padding: 5px 10px;
  color: #914b70;
  cursor: pointer;
}

/* LoveOS Letters app */
.letters-app {
  padding: 15px;
  text-align: center;
  color: #914b70;
}

.letters-paper {
  background: #fff0f6;
  border: 2px dashed #e9a8c5;
  border-radius: 12px;
  padding: 18px;
  min-height: 90px;
  line-height: 1.6;
  margin: 12px 0;
}

.letters-button {
  background: #f8c7dc;
  color: #914b70;
  border: none;
  border-radius: 8px;
  padding: 9px 12px;
  margin: 4px;
  cursor: pointer;
}

.letters-button:hover {
  background: #f2aecb;
}

  </style>
</head>
  
<body>

  
<div class="donut-cursor" id="donutCursor">🍩</div>

  <h1>Love & Peace! ♡</h1>

  
<button onclick="openLoveOS()">💌 Open LoveOS</button>

<!-- Our tiny LoveOS computer! -->
<div class="loveos-window" id="loveosWindow">

 <div class="loveos-title" id="loveosTitle">
    <span>💌 Welcome.txt</span>
    <button class="loveos-close" onclick="closeLoveOS()">×</button>
  </div>

  <div class="loveos-content">
    <h2>Hello, little visitor! ♡</h2>
    <p>Welcome to Vash & Wolfwood's tiny computer!</p>
    <p>🍩 💕 ✨</p>

    
<!-- Our little Letters app! -->
<div class="letters-app">
  <h3>💌 Letters.txt</h3>
  <p>♡ A little note from Wolfwood ♡</p>

  <div class="letters-paper" id="letterText">
    Needle-noggin ate all the donuts again... 🍩
  </div>

  <button class="letters-button" onclick="changeLetter(-1)">← Previous</button>
  <button class="letters-button" onclick="changeLetter(1)">Next →</button>
</div>

  </div>

</div>


  <img src="Vash-Wolfwood-transparent.png"
     class="chibis"
     id="myChibis"
     alt="Vash and Wolfwood"
     onclick="happyJump()">


  <p>Two silly little guys! 🍩</p>
  
<!-- Floating hearts ♡ -->
<div class="floaty"
     style="left:10%; animation-delay:-1s;">
  💗
</div>

<div class="floaty"
     style="left:40%; animation-delay:-3s;">
  💕
</div>

<div class="floaty"
     style="left:85%; animation-delay:-5s;">
  💖
</div>

<!-- Floating donuts 🍩 -->
<div class="floaty"
     style="left:25%; animation-delay:-2s;">
  🍩
</div>

<div class="floaty"
     style="left:70%; animation-delay:-4s;">
  🍩
</div>

<!-- Twinkling sparkles ✨ -->
<div class="sparkle"
     style="top:25%; left:12%;">
  ✨
</div>

<div class="sparkle"
     style="top:40%; right:12%;
            animation-delay:1s;">
  ✦
</div>

<div class="sparkle"
     style="bottom:20%; left:18%;
            animation-delay:0.5s;">
  ✧
</div>


<script>

  
  // Our tiny donut follows the mouse!
  const donutCursor = document.getElementById("donutCursor");

  document.addEventListener("mousemove", function(event) {
    donutCursor.style.display = "block";
    donutCursor.style.left = event.clientX + "px";
    donutCursor.style.top = event.clientY + "px";
  });

  function happyJump() {
    const chibis = document.getElementById("myChibis");

    // Restart the happy jump
    chibis.classList.remove("happy");
    void chibis.offsetWidth;
    chibis.classList.add("happy");

    // Show a cute message
    const message = document.createElement("div");
    message.className = "love-message";
    message.textContent = "LOVE & PEACE!! ♡";
    document.body.appendChild(message);

    setTimeout(() => message.remove(), 1300);

    // Find the center of the chibis
    const rect = chibis.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    // Pop out hearts and donuts!
    const treats = ["🍩", "💕", "💗", "✨", "🍩"];

    treats.forEach((treat, i) => {
      const pop = document.createElement("span");

      pop.className = "pop-treat";
      pop.textContent = treat;
      pop.style.left = centerX + "px";
      pop.style.top = centerY + "px";

      const angle = (i / treats.length) * Math.PI * 2;
      pop.style.setProperty(
        "--x", Math.cos(angle) * 110 + "px"
      );
      pop.style.setProperty(
        "--y", Math.sin(angle) * 110 + "px"
      );

      document.body.appendChild(pop);
      setTimeout(() => pop.remove(), 1000);
    });
  }
  // Close our tiny LoveOS window!
function closeLoveOS() {
  const windowBox = document.getElementById("loveosWindow");
  windowBox.style.display = "none";
}


  // Open our tiny LoveOS window!
  function openLoveOS() {
    const windowBox = document.getElementById("loveosWindow");
    windowBox.style.display = "block";
  }


  
  // Make LoveOS draggable!
  const loveosWindow = document.getElementById("loveosWindow");
  const loveosTitle = document.getElementById("loveosTitle");

  let isDragging = false;
  let startX = 0;
  let startY = 0;
  let originalLeft = 0;
  let originalTop = 0;

  loveosTitle.addEventListener("pointerdown", function(event) {
    if (event.target.closest("button")) return;

    isDragging = true;
    startX = event.clientX;
    startY = event.clientY;

    originalLeft = parseFloat(loveosWindow.style.left) || 0;
    originalTop = parseFloat(loveosWindow.style.top) || 0;

    loveosTitle.setPointerCapture(event.pointerId);
    loveosTitle.style.cursor = "grabbing";
  });

  loveosTitle.addEventListener("pointermove", function(event) {
    if (!isDragging) return;

    loveosWindow.style.left =
      originalLeft + event.clientX - startX + "px";

    loveosWindow.style.top =
      originalTop + event.clientY - startY + "px";
  });

  function stopDragging() {
    isDragging = false;
    loveosTitle.style.cursor = "grab";
  }

  loveosTitle.addEventListener("pointerup", stopDragging);
  loveosTitle.addEventListener("pointercancel", stopDragging);


  
  // Little letters from Vash and Wolfwood!
  const letters = [
    "Wolfwood: Needle-noggin ate all the donuts again... 🍩",
    "Vash: I ONLY ATE THREE!! 🥺",
    "Wolfwood: There were only three, you idiot.",
    "Vash: LOVE AND PEACE!! ✌️💕",
    "Wolfwood: That's not an apology.",
    "Vash: ...Can I have another donut? 🍩"
  ];

  let currentLetter = 0;

  function changeLetter(direction) {
    currentLetter = currentLetter + direction;

    if (currentLetter >= letters.length) {
      currentLetter = 0;
    }

    if (currentLetter < 0) {
      currentLetter = letters.length - 1;
    }

    typeLetter(letters[currentLetter]);
  }

  
  // Magical typewriter for our letters!
  let typingTimer;

  function typeLetter(message) {
    clearInterval(typingTimer);

    const letterBox = document.getElementById("letterText");
    letterBox.textContent = "";

    const characters = Array.from(message);
    let position = 0;

    typingTimer = setInterval(function() {
      if (position < characters.length) {
        letterBox.textContent += characters[position];
        position++;
      } else {
        clearInterval(typingTimer);
      }
    }, 45);
  }

</script>

  
</body>
</html>
