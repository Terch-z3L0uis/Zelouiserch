
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Vash & Wolfwood ♡</title>

  <style>
    body {
      background: #fff0f5;
      text-align: center;
      font-family: Arial, sans-serif;
      padding-top: 60px;
    }

    h1 {
      color: #c87891;
    }

    .chibis {
      width: 300px;
      max-width: 90%;
      animation: bounce 1.2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-35px);
      }
    }
  </style>
</head>

<body>
  <h1>Love & Peace! ♡</h1>

  <img src="Vash&amp;Wolfwood.png"
       class="chibis"
       alt="Vash and Wolfwood">

  <p>Two silly little guys! 🍩</p>
</body>
</html>
